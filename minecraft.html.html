<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Tienda de Minecraft</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    color:white;
    background-image:url('https://www.xtrafondos.com/wallpapers/creeper-de-minecraft-3411.jpg');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

header{
    background:rgba(45,45,45,0.85);
    padding:15px;
    text-align:center;
}

nav{
    background:rgba(58,58,58,0.85);
    padding:10px;
    text-align:center;
}

nav button{
    background:#4CAF50;
    border:none;
    color:white;
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
    border-radius:6px;
}

.productos-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:20px;
    padding:20px;
}

.producto{
    background:rgba(42,42,42,0.92);
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.producto img{
    width:120px;
    height:120px;
    object-fit:contain;
}

.producto button{
    margin-top:10px;
    padding:8px;
    background:#4CAF50;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.carrito-item{
    background:rgba(42,42,42,0.9);
    padding:10px;
    margin:10px;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>Tienda de Minecraft</h1>
</header>

<nav>
<button onclick="mostrar('inicio')">Inicio</button>
<button onclick="mostrar('productos')">Productos</button>
<button onclick="mostrar('carrito')">Carrito</button>
<button onclick="mostrar('contacto')">Contacto</button>
</nav>

<section id="contenido"></section>

<script>

let carrito = [];

// AGREGAR PRODUCTO
function agregarAlCarrito(nombre, precio){
    carrito.push({nombre, precio});
    alert(nombre + " agregado al carrito 🛒");
}

// COMPRAR Y LIMPIAR
function comprarTodo(){
    if(carrito.length === 0){
        alert("Tu carrito está vacío");
        return;
    }

    let total = 0;
    carrito.forEach(p => total += p.precio);

    alert("Total a pagar: $" + total + "\\nGracias por tu compra 🙌");

    carrito = []; // vaciar carrito

    mostrar('carrito'); // 🔥 actualizar vista
}

// MOSTRAR SECCIONES
function mostrar(seccion){

let contenido = document.getElementById("contenido");

if(seccion=="inicio"){
contenido.innerHTML = `
<div style="text-align:center; padding:50px;">
<h2>Bienvenido al mundo de Minecraft</h2>
</div>
`;
}

// PRODUCTOS
if(seccion=="productos"){
contenido.innerHTML = `
<h2 style="text-align:center;">Productos</h2>

<div class="productos-grid">

<div class="producto">
<img src="https://minecraft.wiki/images/Enchanted_Diamond_Sword.gif?f741f">
<h3>Espada de Diamante</h3>
<p>$500</p>
<button onclick="agregarAlCarrito('Espada de Diamante',500)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Enchanted_Netherite_Pickaxe.gif?219b4">
<h3>Pico de Netherite</h3>
<p>$800</p>
<button onclick="agregarAlCarrito('Pico de Netherite',800)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Oak_Planks_JE6_BE3.png">
<h3>Bloques</h3>
<p>$200</p>
<button onclick="agregarAlCarrito('Bloques',200)">Agregar</button>
</div>

<div class="producto">
<img src="https://cdn-icons-png.flaticon.com/512/921/921347.png">
<h3>Pack de Skins</h3>
<p>$150</p>
<button onclick="agregarAlCarrito('Pack de Skins',150)">Agregar</button>
</div>

<div class="producto">
<img src="https://cdn-icons-png.flaticon.com/512/854/854866.png">
<h3>Mapa</h3>
<p>$300</p>
<button onclick="agregarAlCarrito('Mapa',300)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Wolf_JE2_BE2.png">
<h3>Mascotas</h3>
<p>$250</p>
<button onclick="agregarAlCarrito('Mascotas',250)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Diamond_Shovel_JE2_BE2.png">
<h3>Pala de Diamante</h3>
<p>$400</p>
<button onclick="agregarAlCarrito('Pala de Diamante',400)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Shield_JE2_BE1.png">
<h3>Escudo</h3>
<p>$350</p>
<button onclick="agregarAlCarrito('Escudo',350)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Diamond_Chestplate_JE3_BE2.png?40540">
<h3>Armadura Diamante</h3>
<p>$900</p>
<button onclick="agregarAlCarrito('Armadura Diamante',900)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Fire.gif?69f99">
<h3>Fuego</h3>
<p>$1500</p>
<button onclick="agregarAlCarrito('Fuego',1500)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Bow_JE2_BE1.png">
<h3>Arco</h3>
<p>$450</p>
<button onclick="agregarAlCarrito('Arco',450)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Arrow_JE2_BE1.png">
<h3>Flechas</h3>
<p>$100</p>
<button onclick="agregarAlCarrito('Flechas',100)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Enchanted_Golden_Apple_JE2_BE2.gif?f4719">
<h3>Manzana de Notch</h3>
<p>$600</p>
<button onclick="agregarAlCarrito('Manzana de Notch',600)">Agregar</button>
</div>

<div class="producto">
<img src="https://es.minecraft.wiki/images/Ender_Pearl.png?94d20">
<h3>Perla de Ender</h3>
<p>$500</p>
<button onclick="agregarAlCarrito('Perla de Ender',500)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/TNT_JE3_BE2.png?62989">
<h3>TNT</h3>
<p>$700</p>
<button onclick="agregarAlCarrito('TNT',700)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Enchanting_Table.gif?904a7">
<h3>Mesa de Encantamientos</h3>
<p>$1000</p>
<button onclick="agregarAlCarrito('Mesa de Encantamientos',1000)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Damaged_Anvil_%28N%29_JE3.png?335fc">
<h3>Yunque</h3>
<p>$650</p>
<button onclick="agregarAlCarrito('Yunque',650)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Lit_Furnace_%28S%29.gif?40e71">
<h3>Horno</h3>
<p>$300</p>
<button onclick="agregarAlCarrito('Horno',300)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Totem_of_Undying_JE2_BE2.png?d56eb">
<h3>Totem</h3>
<p>$435</p>
<button onclick="agregarAlCarrito('Totem',435)">Agregar</button>
</div>

<div class="producto">
<img src="https://minecraft.wiki/images/Mace_JE1_BE1.png?90f67">
<h3>Mazo</h3>
<p>$777</p>
<button onclick="agregarAlCarrito('Mazo',777)">Agregar</button>
</div>

</div>
`;
}

// CARRITO
if(seccion=="carrito"){

let lista = "";
let total = 0;

if(carrito.length === 0){
lista = "<p>Tu carrito está vacío</p>";
}else{
carrito.forEach(item=>{
    lista += `<div class="carrito-item">🛒 ${item.nombre} - $${item.precio}</div>`;
    total += item.precio;
});
}

contenido.innerHTML = `
<h2>Carrito</h2>
${lista}
<h3>Total: $${total}</h3>
<button onclick="comprarTodo()">Comprar</button>
`;
}

// CONTACTO
if(seccion=="contacto"){
contenido.innerHTML = `
<h2>Contacto</h2>
<p>Diseñador: Brian Alexander Felix Gil. 644363232</p>
<p>Programador: Johan Ramses Balderrama Soto. 64423526</p>
`;
}

}

</script>

</body>
</html>
